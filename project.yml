# Generates Vadan.xcodeproj. On a Mac: `brew install xcodegen`, then `./scripts/setup.sh`
# (or just `xcodegen generate`). The .xcodeproj is not committed; this file is the source.
name: Vadan
options:
  bundleIdPrefix: com.mihilih
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.15.0"
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
targets:
  Vadan:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Google.xcconfig
      Release: Config/Google.xcconfig
    sources:
      - path: Vadan
        excludes:
          - "GoogleService-Info.plist"
          - "Info.plist"
      # Downloaded from the Firebase console (see README). Optional so the project still
      # generates before it's added; the app needs it to run.
      - path: Vadan/GoogleService-Info.plist
        optional: true
        buildPhase: resources
    info:
      path: Vadan/Info.plist
      properties:
        CFBundleDisplayName: Vadan
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # App Check debug token for debug builds, from the git-ignored Config/AppCheck.xcconfig
        # (scripts/setup.sh creates it). Empty in builds without that file.
        AppCheckDebugToken: $(APP_CHECK_DEBUG_TOKEN)
        LSRequiresIPhoneOS: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Same launch screen as Android's splash: the cat mark on deep clay.
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - DMSans-Regular.ttf
          - DMSans-Medium.ttf
          - DMSans-SemiBold.ttf
          - DMSans-Bold.ttf
          - Poppins-Medium.ttf
          - Poppins-SemiBold.ttf
          - Poppins-Bold.ttf
        UIBackgroundModes:
          - remote-notification
        # Google Sign-In returns to the app through this URL scheme. The value comes from
        # Config/Google.xcconfig, which scripts/setup.sh fills in from GoogleService-Info.plist.
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mihilih.projectlanguage
        PRODUCT_NAME: Vadan
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: -ObjC
        DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        CODE_SIGN_STYLE: Automatic
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseFunctions
      - package: Firebase
        product: FirebaseMessaging
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseCrashlytics
      - package: GoogleSignIn
        product: GoogleSignIn
    postCompileScripts:
      # Uploads debug symbols so Crashlytics reports show file and line numbers.
      - name: Crashlytics symbols
        basedOnDependencyAnalysis: false
        script: |
          RUN="${BUILD_DIR%/Build/*}/SourcePackages/checkouts/firebase-ios-sdk/Crashlytics/run"
          if [ -f "${SRCROOT}/Vadan/GoogleService-Info.plist" ] && [ -x "$RUN" ]; then
            "$RUN"
          fi
        inputFiles:
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Resources/DWARF/${PRODUCT_NAME}
          - ${DWARF_DSYM_FOLDER_PATH}/${DWARF_DSYM_FILE_NAME}/Contents/Info.plist
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/GoogleService-Info.plist
          - $(TARGET_BUILD_DIR)/$(EXECUTABLE_PATH)
schemes:
  Vadan:
    build:
      targets:
        Vadan: all
    run:
      config: Debug
    archive:
      config: Release
